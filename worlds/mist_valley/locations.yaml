locations:
  - id: village_square
    name: Village Square
    description: A stone square damp with mist, bordered by shuttered cottages.
    exits:
      north: old_bridge
      east: blacksmith
    visible_objects:
      - notice_board
    visual:
      x: 0
      y: 0
      region_id: village
      icon: plaza
      color_tag: civic
      display_group: village_center
      tags:
        - hub
  - id: old_bridge
    name: Old Bridge
    description: A narrow bridge crosses a pale stream into the fog.
    exits:
      south: village_square
    visual:
      x: 0
      y: -140
      region_id: outskirts
      icon: bridge
      color_tag: travel
      display_group: north_road
  - id: blacksmith
    name: Blacksmith
    description: The forge is cold, but iron filings still glitter near the anvil.
    exits:
      west: village_square
    visible_objects:
      - anvil
    visual:
      x: 160
      y: 0
      region_id: village
      icon: hammer
      color_tag: craft
      display_group: village_center

