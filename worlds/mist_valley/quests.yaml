quests:
  - id: missing_tools
    title: Missing Tools
    description: Harlan's best tools vanished before dawn.
    initial_stage: ask_harlan
    visibility: public
    stages:
      - id: ask_harlan
        title: Speak with Harlan
        description: Ask Harlan what went missing from the forge.
        objectives:
          - talk_to_harlan
        next_stages:
          - follow_bridge_clue
      - id: follow_bridge_clue
        title: Follow the Bridge Clue
        description: Check the old bridge for signs tied to the missing tools.
        objectives:
          - discover_bridge_clue
        next_stages: []
    triggers:
      - type: npc_talked
        id: harlan
        action: complete_objective
        objective_id: talk_to_harlan
        next_stage: follow_bridge_clue
      - type: fact_discovered
        id: old_bridge_creaks_at_midnight
        action: complete_objective
        objective_id: discover_bridge_clue
  - id: sealed_letter_mystery
    title: Sealed Letter
    description: A hidden letter may explain who has been moving through the square.
    initial_stage: find_letter
    visibility: hidden
    stages:
      - id: find_letter
        title: Find the Letter
        description: Locate the sealed letter hidden somewhere in the village square.
        objectives:
          - discover_letter
          - take_letter
        next_stages: []
    triggers:
      - type: fact_discovered
        id: sealed_letter_under_stone
        action: complete_objective
        objective_id: discover_letter
      - type: item_acquired
        id: sealed_letter
        action: complete_objective
        objective_id: take_letter

