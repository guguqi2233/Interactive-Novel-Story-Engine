id: combat_encounter_light
name: Combat Encounter Light
description: Adds a light non-lethal combat NPC with a visible fallback path.
template_type: combat_encounter
required_variables: []
optional_variables:
  npc_id: road_bully
output_files:
  - file_name: npcs.yaml
    content: |
      npcs:
        - id: harlan
          name: Harlan
          location_id: blacksmith
          faction_id: village_council
          personality: Wary, practical, and slow to trust strangers.
          knowledge: [old_bridge_creaks_at_midnight, mayor_hides_missing_tools]
          goals:
            - id: share_bridge_warning
              description: Warn trusted villagers about the old bridge.
              priority: 5
              status: active
              conditions: [knows:old_bridge_creaks_at_midnight]
              desired_state:
                rumor: bridge_warning_shared
              allowed_actions: [talk_to_npc, spread_rumor]
              forbidden_actions: [attack]
          priorities:
            community_safety: 5
            personal_risk: 3
          constraints: [avoid_unnecessary_violence]
          plan_state: {}
          merchant: true
          shop_inventory: [iron_nails]
          buy_price_modifier: 1.0
          sell_price_modifier: 0.5
          schedule:
            - time_of_day: morning
              location_id: blacksmith
              activity: tending the cold forge
            - time_of_day: evening
              location_id: village_square
              activity: listening for village gossip
        - id: {{npc_id}}
          name: Road Bully
          location_id: old_bridge
          personality: Loud, nervous, and more frightening than brave.
          faction_id: old_road_smugglers
          combat:
            hp: 6
            damage: 1
            stance: cautious
            non_lethal_allowed: true
          tags: [starter, combat]
validation_rules:
  - Encounter must avoid hidden witness leakage and preserve non-lethal options.
tags: [starter, combat, non-lethal]
